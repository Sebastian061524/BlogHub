spring:
  application:
    name: bloghub
  datasource:
    url: jdbc:mysql://localhost:3306/bloghub
    username: root
    password: ${BLOGHUB_DB_PASSWORD}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret-base64: ${BLOGHUB_JWT_SECRET}
  expiration-seconds: 7200
